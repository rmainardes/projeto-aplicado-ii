# application.properties
mp.jwt.verify.issuer=foodtruck-app

# Nega acesso a qualquer endpoint JAX-RS que não declare @RolesAllowed/@PermitAll
# explicitamente, para evitar recursos abertos por esquecimento.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# JWT é lido do cookie HttpOnly "access_token" em vez do header Authorization
# (ver AuthResource, que emite/expira esse cookie no login/logout).
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token

# O Quarkus procura estes arquivos dentro de src/main/resources por padr�o
smallrye.jwt.sign.key.location=file:/etc/secrets/privateKey.pem
mp.jwt.verify.publickey.location=file:/etc/secrets/publicKey.pem

quarkus.http.port=${PORT:8080}

# BANCO DE DADOS:
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}

# Substitua pela URL real do seu front-end na Vercel
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://projeto-aplicado-ii.vercel.app
# Necessário para o navegador aceitar/enviar o cookie HttpOnly entre origens
# diferentes (front na Vercel, back em outro domínio).
quarkus.http.cors.access-control-allow-credentials=true

# Hibernate em Prod
quarkus.hibernate-orm.schema-generation.database.generation=validate