# application.properties (perfil de teste)
# application.properties base aponta as chaves JWT para /etc/secrets/*.pem,
# um caminho que só existe no ambiente de produção. Nos testes, usamos as
# mesmas chaves de exemplo do classpath que o perfil dev já usa.
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
